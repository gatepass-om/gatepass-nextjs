name: Frontend CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: NEXT_PUBLIC_BACKEND_URL=https://api.gatepass.example npm run build

  browser-smoke:
    if: ${{ vars.GATEPASS_E2E_BACKEND_URL != '' }}
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BACKEND_URL: ${{ vars.GATEPASS_E2E_BACKEND_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: PLAYWRIGHT_BASE_URL=http://127.0.0.1:3001 npm run e2e
